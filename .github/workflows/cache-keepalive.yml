name: Keep build caches warm

# GitHub evicts Actions caches that haven't been accessed for 7 days.
# Reading them every few days resets that timer, so a deploy after a long
# pause still hits the cached kernel, busybox and micropython stages.
# The cache scope must match deploy.yml (type=gha,scope=b0tn3t).

on:
  schedule:
    - cron: '17 4 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  touch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.34.2

      # every stage of the `repro` target comes from the cache: nothing is
      # rebuilt, but each cache entry is read (and so kept alive)
      - name: Touch the build cache
        run: |
          docker buildx build --target repro --output type=cacheonly \
            --cache-from type=gha,scope=b0tn3t .
