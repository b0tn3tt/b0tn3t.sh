name: Build, test and deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.34.2

      # every stage is cached in the GitHub Actions cache: editing the page
      # or content/*.txt does not rebuild the kernel, busybox or micropython
      - name: Build the site
        run: |
          docker buildx build --target site --output type=local,dest=dist/site \
            --cache-from type=gha,scope=b0tn3t --cache-to type=gha,mode=max,scope=b0tn3t .
      - name: Build the in-kernel vmd variant
        run: |
          docker buildx build --target kvmd-out --output type=local,dest=dist \
            --cache-from type=gha,scope=b0tn3t .

      - name: C unit tests and vmd <-> vm round trip (i386, musl)
        run: docker buildx build --target test-c --output type=cacheonly --cache-from type=gha,scope=b0tn3t .

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS unit tests
        run: make test-js LIMIT=
      - name: Integration (the image in v86 under Node)
        run: make test-int LIMIT=

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Browser end-to-end (Firefox, Chrome)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: make test-e2e LIMIT=

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
